# Read-only operation: no telemetry or command links are started.
timeService:
  class: org.yamcs.time.SimulationTimeService
services:
- class: org.yamcs.archive.XtceTmRecorder
- class: org.yamcs.archive.ParameterRecorder
- class: org.yamcs.archive.ReplayServer
- class: org.yamcs.parameterarchive.ParameterArchive
  args:
    realtimeFiller:
      enabled: false
    backFiller:
      enabled: true
      warmupTime: 0
dataLinks: []
mdb:
- type: xtce
  args:
    file: mdb/ccsds.xtce
- type: xtce
  args:
    file: mdb/cfs/cf.xtce
- type: xtce
  args:
    file: mdb/cfs/cfe_es.xtce
- type: xtce
  args:
    file: mdb/cfs/cfe_evs.xtce
- type: xtce
  args:
    file: mdb/cfs/cfe_sb.xtce
- type: xtce
  args:
    file: mdb/cfs/cfe_tbl.xtce
- type: xtce
  args:
    file: mdb/cfs/cfe_time.xtce
- type: xtce
  args:
    file: mdb/cfs/ci.xtce
- type: xtce
  args:
    file: mdb/cfs/ds.xtce
- type: xtce
  args:
    file: mdb/cfs/fm.xtce
- type: xtce
  args:
    file: mdb/cfs/lc.xtce
- type: xtce
  args:
    file: mdb/cfs/sc.xtce
- type: xtce
  args:
    file: mdb/cfs/sch.xtce
- type: xtce
  args:
    file: mdb/cfs/to.xtce
- type: xtce
  args:
    file: mdb/sim_42_truth.xtce
- type: xtce
  args:
    file: mdb/shire_visual.xtce
- type: xtce
  args:
    file: mdb/components/adcs/adcs.xtce
- type: xtce
  args:
    file: mdb/components/demo/demo.xtce
- type: xtce
  args:
    file: mdb/components/eps/eps.xtce
- type: xtce
  args:
    file: mdb/components/radio/radio.xtce
- type: xtce
  args:
    file: mdb/shire_server.xtce
streamConfig:
  tm:
  - name: tm_realtime
    processor: realtime
    rootContainer: /CCSDS/CCSDS_TM
  - name: truth42_data
    processor: realtime
    rootContainer: /SIM_42_TRUTH/SIM_42_TRUTH_DATA
  - name: visual_data
    processor: realtime
    rootContainer: /SHIRE_VISUAL/SHIRE_VISUAL_DATA
  - name: server_status_data
    processor: realtime
    rootContainer: /SHIRE_SERVER/SERVER_STATUS
  - name: tm_dump
  cmdHist:
  - cmdhist_realtime
  - cmdhist_dump
  event:
  - events_realtime
  - events_dump
  param:
  - pp_realtime
  - pp_dump
  - sys_param
  - proc_param
  parameterAlarm:
  - alarms_realtime
  tc: []
