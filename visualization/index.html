<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SHIRE Visualization</title><link rel="icon" type="image/svg+xml" href="/visualization/favicon.svg"></head><body><div id="app"><div id="globe"></div><aside><h1>SHIRE Visualization</h1><p id="status">Connecting to Yamcs…</p><div class="row"><button id="live">Live</button><button id="replay">Replay</button><button id="play">Pause</button></div><label>Timeline<input id="timeline" type="range" min="0" max="1000" value="1000"></label><div class="row"><label>Playback <input id="speed" type="number" min="0.01" max="1000" step="any" value="1">×</label><label>Render FPS <input id="fps" type="number" min="1" max="60" value="30"></label></div><div class="row"><label>Camera <select id="camera"><option value="earth">Earth overview</option><option value="follow">Spacecraft follow</option><option value="attitude" selected>Attitude inspection</option></select></label><label><input id="trail" type="checkbox" checked><span class="swatch orbit-color"></span> Orbit trail</label></div><div class="row"><label><input id="axes" type="checkbox" checked><span class="swatch axis-x"></span><span class="swatch axis-y"></span><span class="swatch axis-z"></span> Body axes</label><label><input id="sun" type="checkbox" checked><span class="swatch sun-color"></span> Sun vector</label></div><div id="bookmarks"></div><div id="diagnostics"></div><small id="credits"><span>Earth imagery: configured asset (default NASA Blue Marble).</span><span>Spacecraft model: <span id="model-name">Loading…</span></span></small></aside><section id="map-panel" aria-label="Current orbit ground track"><h2>Ground track</h2><div id="map-image"><canvas id="ground-map" width="360" height="180"></canvas></div><div class="map-legend"><span><i class="swatch trail-color"></i> Recorded</span><span><i class="swatch predicted-color"></i> Expected</span><span><i class="swatch shadow-color"></i> Eclipse</span><span><i class="swatch current-color"></i> Current</span></div></section></div><script type="module" src="/src/main.ts"></script></body></html>
